[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-post-mcp"
version = "0.1.0"
description = "MCP server providing an interface to PostgreSQL with PostGIS"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.2",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "mcp>=1.26.0",
]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external dependencies required)",
    "functional: Functional tests (requires PostgreSQL with PostGIS)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 88
